  </defs>

  <!-- anillo -->
  <path d="M46 46 A76 76 0 0 0 46 154" fill="none" stroke="url(#oro)" stroke-width="5" stroke-linecap="round"/>
  <path d="M154 46 A76 76 0 0 1 154 154" fill="none" stroke="url(#oro)" stroke-width="5" stroke-linecap="round"/>

  <!-- corona -->
