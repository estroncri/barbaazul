<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Arena Azul">
  <title>Arena Azul</title>
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="0.45" stop-color="#ff9d1a"/>
      <stop offset="1" stop-color="#ff4d00"/>
    </linearGradient>
    <linearGradient id="oro2" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#ffb02e"/>
