# Torneos FF — configuración de Cloudflare Workers
#
# Desplegar:
#   cd torneos/servidor/worker
#   npx wrangler d1 create torneos-ff        # copia el database_id que imprime
#   npx wrangler d1 migrations apply torneos-ff --remote
#   npx wrangler secret put ADMIN_PASS       # y los demás secretos
#   npx wrangler deploy

name = "torneos-ff"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "torneos-ff"
database_id = "PON_AQUI_EL_ID_QUE_TE_DE_WRANGLER"

[vars]
ORIGENES = "https://estroncri.github.io"
MIN_RECARGA = "1000"
MIN_RETIRO = "10000"
WOMPI_REDIRECT = "https://estroncri.github.io/barbaazul/torneos/#/billetera"

# Los secretos NO van aquí. Se cargan uno por uno con:
#   npx wrangler secret put ADMIN_FF_UID
#   npx wrangler secret put ADMIN_PASS
#   npx wrangler secret put WOMPI_LLAVE_PUBLICA
#   npx wrangler secret put WOMPI_INTEGRIDAD
#   npx wrangler secret put WOMPI_EVENTOS
