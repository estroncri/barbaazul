# Plano de despliegue para Render.
# En Render: New → Blueprint → elegir este repositorio.
# Lee este archivo y deja el servicio armado; solo hay que escribir los
# secretos, que a propósito NO están aquí.

services:
  - type: web
    name: torneos-ff-api
    runtime: node
    plan: starter          # Starter y no free: el plan gratuito no admite disco,
                           # y sin disco la base de datos se borra en cada
                           # despliegue. Con ella se irían cuentas y saldos.
    region: oregon
    buildCommand: "echo sin dependencias que instalar"
    startCommand: "node torneos/servidor/api/servidor.js"
    healthCheckPath: /api/salud
    autoDeploy: true

    disk:
      name: datos
      mountPath: /data     # Aquí vive torneos.db y sobrevive a los despliegues
      sizeGB: 1

    envVars:
      - key: DB_RUTA
        value: /data/torneos.db
      - key: ORIGENES
        value: https://estroncri.github.io
      - key: NODE_VERSION
        value: "22.11.0"

      # Los siguientes se escriben a mano en el panel de Render.
      # sync:false = Render los pide al desplegar y no quedan en el repositorio.
      - key: ADMIN_FF_UID
        sync: false        # Tu ID de Free Fire: esa cuenta será la del organizador
      - key: ADMIN_PASS
        sync: false        # Contraseña larga, que no uses en ningún otro lado
      - key: ADMIN_NICK
        sync: false
      - key: ADMIN_WHATSAPP
        sync: false

      - key: WOMPI_LLAVE_PUBLICA
        sync: false        # pub_test_... para probar, pub_prod_... para cobrar
      - key: WOMPI_INTEGRIDAD
        sync: false        # Secreto de integridad. Nunca en el repositorio
      - key: WOMPI_EVENTOS
        sync: false        # Secreto de eventos. Nunca en el repositorio
      - key: WOMPI_REDIRECT
        sync: false        # https://estroncri.github.io/barbaazul/torneos/#/billetera
