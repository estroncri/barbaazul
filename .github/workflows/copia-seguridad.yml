# Una copia de la base, todos los días.
#
# La base guarda el libro del dinero: quién puso, quién cobró y a quién se
# le debe. Es lo único de todo esto que no se puede volver a hacer. El
# código está en el repositorio y el servidor se vuelve a desplegar en tres
# minutos; los movimientos de cincuenta jugadores no.
#
# Corre sola a las 4 de la mañana (hora de Colombia) y se puede lanzar a
# mano desde Actions. Cada copia queda guardada 90 días como archivo
# descargable de la corrida.
#
# Para restaurar: descarga el .sql de la corrida que quieras y
#   npx wrangler d1 execute torneos-ff --remote --file=copia.sql
# sobre una base vacía. Practícalo UNA vez contra una base de prueba antes
# de necesitarlo de verdad, que es cuando no se puede practicar.

name: Copia de seguridad

on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC = 4:00 a. m. en Colombia
  workflow_dispatch:

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar wrangler
        working-directory: servidor/worker
        run: npm install --no-audit --no-fund

      - name: Apuntar a la base
        working-directory: servidor/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID=$(npx wrangler d1 list --json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const j=JSON.parse(s.slice(s.indexOf('[')));
              const b=j.find(x=>x.name==='torneos-ff');
              process.stdout.write(b ? (b.uuid||b.database_id) : '');
            });")
          if [ -z "$ID" ]; then echo "No encontré la base torneos-ff."; exit 1; fi
          sed -i "s|^database_id = .*|database_id = \"$ID\"|" wrangler.toml

      - name: Sacar la copia
        working-directory: servidor/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export torneos-ff --remote --output=copia.sql

      - name: Comprobar que la copia sirve
        working-directory: servidor/worker
        run: node comprobar-copia.mjs copia.sql

      - name: Guardarla
        uses: actions/upload-artifact@v4
        with:
          name: copia-${{ github.run_number }}
          path: servidor/worker/copia.sql
          retention-days: 90
