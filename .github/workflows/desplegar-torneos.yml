# Despliega el servidor de Torneos FF en Cloudflare.
#
# Se lanza desde la pestaña Actions de GitHub (botón "Run workflow"), o solo
# cuando cambia el código del servidor.
#
# Los secretos se configuran en:
#   Settings → Secrets and variables → Actions → New repository secret
# y van de GitHub a Cloudflare directamente: no quedan en el repositorio.

name: Desplegar Torneos FF

on:
  workflow_dispatch:          # el botón para lanzarlo a mano
  push:
    branches: [main]
    paths:
      - 'torneos/servidor/worker/**'

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar que están las llaves de Cloudflare
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN."
            echo "Créalo en Cloudflare (Mi perfil → Tokens de API) con permisos"
            echo "de Workers Scripts:Edit y D1:Edit, y añádelo en"
            echo "Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Instalar wrangler
        working-directory: torneos/servidor/worker
        run: npm install --no-audit --no-fund

      - name: Comprobar las reglas del dinero antes de publicar
        working-directory: torneos/servidor/worker
        run: node probar.mjs

      - name: Desplegar
        working-directory: torneos/servidor/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WOMPI_LLAVE_PUBLICA: ${{ secrets.WOMPI_LLAVE_PUBLICA }}
          WOMPI_INTEGRIDAD: ${{ secrets.WOMPI_INTEGRIDAD }}
          WOMPI_EVENTOS: ${{ secrets.WOMPI_EVENTOS }}
          FF_PROVEEDOR: ${{ secrets.FF_PROVEEDOR }}
          FF_API_URL: ${{ secrets.FF_API_URL }}
          FF_API_KEY: ${{ secrets.FF_API_KEY }}
          ADMIN_FF_UID: ${{ secrets.ADMIN_FF_UID }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          ADMIN_NICK: ${{ secrets.ADMIN_NICK }}
          ADMIN_WHATSAPP: ${{ secrets.ADMIN_WHATSAPP }}
        run: node ci-desplegar.mjs
